<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Remove vite.svg to not expose the tech stack; use a proper favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B192C" />

    <!-- Primary SEO -->
    <title>Janki Ballabh Services | Industrial Infrastructure</title>
    <meta name="description" content="Premier industrial services, pipeline construction, and solar energy solutions delivered with uncompromising safety and innovation." />

    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://jankiballabh.com" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jankiballabh.com" />
    <meta property="og:title" content="Janki Ballabh Services | Industrial Infrastructure" />

    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Janki Ballabh Services" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://jankiballabh.com" />
    <meta name="twitter:title" content="Janki Ballabh Services | Industrial Infrastructure" />
    <meta name="twitter:description" content="Premier industrial services, pipeline construction, and solar energy solutions." />
    <meta name="twitter:image" content="https://jankiballabh.com/og-image.jpg" />

    <!-- Google Fonts: preconnect for DNS + TLS warmup, then async load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap"
      rel="preload"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Preload Hero Image for LCP improvement (fetchpriority=high tells browser this is critical) -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1518314916381-77a37c2a49ae?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=75"
      fetchpriority="high"
    />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

        "@type": "PostalAddress",

  <body class="bg-slate-50 text-slate-900 font-sans antialiased overflow-x-hidden">
